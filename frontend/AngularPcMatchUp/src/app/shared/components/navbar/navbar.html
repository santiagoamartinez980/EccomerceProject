<nav class="navbar">
  <div class="navbar-inner">

    <!-- Marca -->
    <a class="brand" routerLink="/">
      <div class="brand-icon">
        <mat-icon>{{ brandIcon() }}</mat-icon>
      </div>
      <span class="brand-name">{{ brandName() }}</span>
    </a>

    <!-- Links -->
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="link-active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        Inicio
      </a>
      <a routerLink="/catalogo" routerLinkActive="link-active" class="nav-link">
        Catálogo
      </a>
    </div>

    <!-- Acciones -->
    <div class="nav-actions">

      <!-- Carrito -->
      <a routerLink="/carrito" class="action-btn" matTooltip="Carrito">
        <mat-icon>shopping_bag</mat-icon>
      </a>

      <!-- Sesión -->
          @if (isLoggedIn()) {

      <button
        class="action-btn profile-btn"
        mat-icon-button
        [matMenuTriggerFor]="profileMenu"
        matTooltip="Mi perfil">

        <mat-icon>person</mat-icon>

      </button>

      <mat-menu #profileMenu="matMenu">

        <button mat-menu-item routerLink="/direcciones">
          <mat-icon>location_on</mat-icon>
          <span>Mis direcciones</span>
        </button>

        <button mat-menu-item routerLink="/ordenes">
          <mat-icon>receipt_long</mat-icon>
          <span>Mis órdenes</span>
        </button>

        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>

      </mat-menu>

    } @else {

      <a routerLink="/auth/login" class="btn-primary">
        Iniciar sesión
      </a>

    }

    </div>

  </div>
</nav>
