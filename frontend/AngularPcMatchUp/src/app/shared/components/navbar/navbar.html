<nav class="navbar">
  <div class="navbar-inner">

    <!-- Marca -->
    <a class="brand" routerLink="/">
      <div class="brand-icon">
        <mat-icon>{{ brandIcon() }}</mat-icon>
      </div>
      <span class="brand-name">{{ brandName() }}</span>
    </a>

    <!-- Links -->
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="link-active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        {{ 'nav.home' | t }}
      </a>
      <a routerLink="/productos" routerLinkActive="link-active" class="nav-link">
        {{ 'nav.catalog' | t }}
      </a>
    </div>

    <!-- Acciones -->
    <div class="nav-actions">

      <!-- Idioma -->
      <button
        type="button"
        class="action-btn lang-btn"
        [matTooltip]="'nav.language' | t"
        [attr.aria-label]="'nav.language' | t"
        (click)="i18n.toggle()">
        {{ i18n.lang() === 'es' ? 'EN' : 'ES' }}
      </button>

      <!-- Carrito -->
      <a routerLink="/carrito" class="action-btn" [matTooltip]="'nav.cart' | t">
        <mat-icon>shopping_bag</mat-icon>
      </a>

      <!-- Sesión -->
          @if (isLoggedIn()) {

      <button
        class="action-btn profile-btn"
        mat-icon-button
        [matMenuTriggerFor]="profileMenu"
        [matTooltip]="'nav.profile' | t">

        <mat-icon>person</mat-icon>

      </button>

      <mat-menu #profileMenu="matMenu">

        <button mat-menu-item routerLink="/direcciones">
          <mat-icon>location_on</mat-icon>
          <span>{{ 'nav.addresses' | t }}</span>
        </button>

        <button mat-menu-item routerLink="/pedidos">
          <mat-icon>receipt_long</mat-icon>
          <span>{{ 'nav.orders' | t }}</span>
        </button>

        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>{{ 'nav.logout' | t }}</span>
        </button>

      </mat-menu>

    } @else {

      <a routerLink="/auth/login" class="btn-primary">
        {{ 'nav.login' | t }}
      </a>

    }

    </div>

  </div>
</nav>
