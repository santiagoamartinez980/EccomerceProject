version: '3.8'

networks:
  app_network:
    driver: bridge

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -Q 'SELECT 1' -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend/APIEccomerce
    ports:
      - "5000:8080"
    container_name: api_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
        ConnectionStrings__DefaultConnection: "Server=db,1433;Database=EccomerceDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
        Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
        Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
        Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend/AngularPcMatchUp
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    container_name: angular_frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqldata: